<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RAM · Axiom‑1 · 4‑Wertigkeiten · Hardware‑Sequencer</title>

<style>
body { background:#000; color:#0ff; font-family:monospace; padding:40px; }
.ram { border:2px solid #0ff; padding:20px; width:620px; }
.stat { margin-top:12px; color:#0f0; }
.ax { margin-top:20px; color:#ff0; }
.id { margin-top:20px; color:#09f; }
.sys { margin-top:20px; color:#f0f; }
button { background:#0f0; color:#000; padding:10px 20px; border:none; cursor:pointer; }
</style>
</head>

<body>

<h2>RAM · Axiom‑1 · 4‑Wertigkeiten‑Sequencer</h2>

<div class="ram">

    <!-- RAM ID -->
    <div class="id">
        <h3>RAM‑ID</h3>
        <pre id="ramID"></pre>
    </div>

    <!-- RAM Werte -->
    <h3>RAM‑Wertigkeiten</h3>
    <div class="stat" id="block">BLOCK: 0</div>
    <div class="stat" id="cache">CACHE: 0</div>
    <div class="stat" id="flow">FLOW: 0</div>
    <div class="stat" id="state">STATE: 1.0</div>

    <!-- Systemwerte -->
    <div class="sys">
        <h3>Systemwerte</h3>
        <pre id="sysValues"></pre>
    </div>

    <!-- Hardware Axiome -->
    <div class="ax">
        <h3>Hardware‑Axiome (CSV)</h3>
        <pre id="axioms"></pre>
    </div>
</div>

<button onclick="runCycle()">RAM‑Zyklus</button>

<script type="module">
import { RAMModule } from "./RAM.module.js";
import { loadHardwareAxioms } from "./RAM.hardware.js";
import { RAM_ID } from "./RAM‑ID.js";

const ram = new RAMModule();

// RAM‑ID anzeigen
document.getElementById("ramID").innerText =
    JSON.stringify(RAM_ID, null, 2);

// Systemwerte anzeigen
document.getElementById("sysValues").innerText =
    JSON.stringify({
        size: ram.size,
        speed: ram.speed,
        cacheLevel: ram.cacheLevel,
        gate: ram.gate,
        eich: ram.eich,
        kette: ram.kette,
        cluster: ram.cluster,
        mode: ram.mode
    }, null, 2);

// Hardware‑Axiome laden
async function init(){
    const axioms = await loadHardwareAxioms();
    document.getElementById("axioms").innerText =
        JSON.stringify(axioms, null, 2);
}
init();

// RAM‑Zyklus
function runCycle(){
    const snap = ram.cycle();
    document.getElementById("block").innerText = "BLOCK: " + snap.block;
    document.getElementById("cache").innerText = "CACHE: " + snap.cache;
    document.getElementById("flow").innerText  = "FLOW: " + snap.flow.toFixed(4);
    document.getElementById("state").innerText = "STATE: " + snap.state.toFixed(4);
}
</script>

</body>
</html>
